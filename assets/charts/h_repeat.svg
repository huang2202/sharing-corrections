<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" class="chart" role="img" aria-label="Share of pairs that turn from success to failure between two runs of the base, and between the base and each editor." data-chart="h_repeat"><title>Share of pairs that turn from success to failure between two runs of the base, and between the base and each editor.</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;fill:#5d6872}.tl{fill:#47525c}.dl{fill:#14181c;font-weight:600}.dl2{fill:#47525c;font-size:11.5px}.ink{fill:#14181c}.in{font-size:11.5px;font-weight:600}.on-rescue,.on-harm,.on-kept{fill:#fff}.on-fail{fill:#14181c}.grid{stroke:#e2e6ea;stroke-width:1}.grid.zero,.axis{stroke:#b7bfc7;stroke-width:1}.ref{stroke:#8c939a;stroke-width:1;stroke-dasharray:3 3}.band{fill:#8c939a;fill-opacity:.26}.region{fill:#8c939a;fill-opacity:.1}.hit{fill:transparent}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ln.thin{stroke-width:1.25}.ln.s-L3{stroke-dasharray:6 3}.tick{stroke-width:2}.whisk{stroke-width:1.5;stroke-opacity:.55}.err{stroke:#14181c;stroke-width:1.3}.err-bg{stroke:#fff;stroke-width:3.6;stroke-linecap:round}.pt{stroke:#fff;stroke-width:1.6;paint-order:stroke}.c-rescue{fill:#168979}.c-harm{fill:#A04C25}.c-kept{fill:#3C444C}.c-fail{fill:#8C939A}.s-rescue{stroke:#168979}.s-harm{stroke:#A04C25}.c-L1{fill:#15466E}.s-L1{stroke:#15466E}.t-L1{fill:#15466E;fill-opacity:.38}.o-L1{fill:#fff;stroke:#15466E;stroke-width:2}.c-L2{fill:#3087AF}.s-L2{stroke:#3087AF}.t-L2{fill:#3087AF;fill-opacity:.38}.o-L2{fill:#fff;stroke:#3087AF;stroke-width:2}.c-L3{fill:#69758D}.s-L3{stroke:#69758D}.t-L3{fill:#69758D;fill-opacity:.38}.o-L3{fill:#fff;stroke:#69758D;stroke-width:2}.b-L1{fill:#15466E}.b-L2{fill:#3087AF}.b-L3{fill:url(#hatch-L3) #69758D}.hatch-bg{fill:#69758D;fill-opacity:.3}.hatch-fg{fill:#69758D}.c-ink{fill:#14181c}.c-ink3{fill:#6b7782}.s-ink{stroke:#14181c}.o-ink{fill:#fff;stroke:#141